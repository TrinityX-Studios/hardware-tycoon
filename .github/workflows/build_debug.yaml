name: Build Debug Release

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout code
        uses: actions/checkout@v4

      - name: 🎯 Set environment variables
        id: vars
        run: |
          # Extract current tag from git
          tag=$(git tag --points-at HEAD 2>/dev/null || echo "v1.0.0-alpha.1")
          commit=$(git rev-parse --short HEAD)
          timestamp=$(date +"%Y-%m-%d %H:%M:%S")
          
          echo "commit_hash=$commit" >> $GITHUB_ENV
          echo "tag=$tag" >> $GITHUB_ENV
          echo "timestamp=$timestamp" >> $GITHUB_ENV

      - name: 🔧 Configure Linux Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libpulse-dev libnss3-dev libxkbcommon-dev libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-tools gstreamer1.0-libav

      - name: Check GStreamer if Present
        run: |
          gst-inspect-1.0 --version
          ls -l /usr/lib/x86_64-linux-gnu/gstreamer-1.0/


      - name: 🏗️ Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🧹 Remove local-only gradle.properties settings
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' android/gradle.properties
          fi

      - name: 🛠️ Install Dart tools
        run: |
          dart --version

      
      - name: 📋 View Git Information
        run: |
          echo "=== GIT INFO ==="
          git log -1 --pretty=fuller
          echo "================"
      
      - name: Build Debug Release (Linux)
        continue-on-error: true
        run: |
          ./build.sh debug linux

      - name: Build Debug Release (APK)
        continue-on-error: true
        run: |
          ./build.sh debug apk         

      - name: Package ZIP (Linux)
        continue-on-error: true
        run: |
          zip -r hardware_tycoon_linux-${{ env.commit_hash }}.zip "build/linux/x64/debug/bundle"
          
      - name: Package APK (Android)
        continue-on-error: true
        run: |
          zip -r "hardware_tycoon_android-${{ env.commit_hash }}.apk.zip" "build/android/app/debug/app-debug.apk"

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hardware-tycoon-debug
          path: |
            hardware_tycoon_linux-${{ env.commit_hash }}.zip
            hardware_tycoon_android-${{ env.commit_hash }}.apk.zip